[env:seeed_xiao_esp32s3]
; PINNED, and not to the newest. The platform's 55.x line ships Arduino core
; 3.x, where `BLEDevice::setEncryptionLevel` moved to `BLESecurity`. The Canon
; library still calls the old one twice inside `pair()`, so an unpinned
; `platform = espressif32` fails to compile -- in the library's own source,
; where it reads like the library is broken rather than like the core moved.
; 6.11.0 is the last release of the 2.0.x-core line and is what the library was
; written against. Raising this means vendoring a patched copy of the library.
platform = espressif32@6.11.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

lib_deps =
    ; The Canon library itself is vendored in lib/CanonBLERemote -- a fork of
    ; maxmacstn/ESP32-Canon-BLE-Remote tag 1.0.2 with three real-hardware
    ; patches (see lib/CanonBLERemote/FORK.md). It stopped being a dependency
    ; the day the R6 turned out to need a write mode and a press byte upstream
    ; has never shipped. ArduinoNvs, its own dependency, is resolved from its
    ; library.json automatically.
    rpolitex/ArduinoNvs @ ^2.5

build_flags =
    ; REQUIRED. Without this, `Serial` maps to UART0 on the physical pins
    ; instead of the native USB port. The board enumerates, the host opens the
    ; port, every write succeeds -- and nothing ever arrives. There is no error
    ; anywhere in that chain, which is what makes it expensive to debug.
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D FW_VERSION='"1.1.0"'

    ; What the board calls itself in the camera's pairing list, and how long it
    ; scans. Both are here rather than in main.cpp because they are the two
    ; things a second machine in the same room has to change: two boards
    ; answering to one name is a camera pairing with whichever it saw first.
    -D REBOT_BLE_NAME='"rebot-copilot"'
    ; MEASURED on hardware: a PAIR reply takes *twice* this, not once.
    ; CanonBLERemote::pair() calls scan(), which blocks for the whole duration
    ; in Arduino core 2.x, and only then enters a busy-wait loop bounded by the
    ; same duration -- so 20 here answered after 40.0 s, ten seconds past the
    ; host's PAIR_TIMEOUT_S (30 s, backend/shutter/base.py). Past that the host
    ; reports a pairing that failed and then counts the real answer as a stale
    ; reply to whatever it sent next. 10 keeps the whole exchange inside 30 s;
    ; the camera sits on its pairing screen regardless, so the window a person
    ; has is not what this bounds.
    -D REBOT_PAIR_SCAN_SECONDS=10
    ; Also mirrored in backend/config.py as REBOT_SHUTTER_BAUD; the two have to
    ; agree, and this is the side that cannot read an environment variable.
    -D REBOT_SERIAL_BAUD=115200
