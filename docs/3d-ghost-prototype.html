<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>真 3D 原型 · 幽灵位姿 + 受限相机（相机契约实测）</title>
<!--
  真 3D 原型 —— 回答两个问题：
  ①「幽灵位姿」在真实 3D 渲染里长什么样：已存位姿 = 同一条臂的 URDF 克隆，
     按关节角摆好、半透明、挂名字标签；实心臂 = 当前真实状态。
  ② 相机契约六条在真 3D 里的手感：
       锚点固定（臂基座 / 目标位姿）· 禁平移 · 俯仰 0.15–π/2（永不下地平线）· 禁翻滚
       · 缩放 0.5–3.5 限幅 · 复位/操作者视角双预设 · 跟随目标默认关、手动拖动即让位。
  依赖仓库内资源（python http.server 从仓库根服务）：
       three@0.170（frontend/node_modules）、urdf-loader@0.12.7、vendor 里的 URDF+STL。
  演示数据 = frontend/mock/state.ts 的种子位姿（正面/右45°/侧面/俯拍）。
  颜色纪律：默认灰阶；琥珀=目标/臂动；红=急停。状态行永远只有一行。
-->
<style>
  :root{ --bg:#0a0d12; --p1:#14181f; --p2:#1a2029; --line:#232b36; --line2:#2a3340;
    --tx:#b8c0cc; --dim:#7d8794; --faint:#5b6572; --amber:#cf9c46; --red:#c8504b; --green:#4f9d69; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--tx);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
       height:100vh;overflow:hidden;display:flex;flex-direction:column}
  button{font:inherit}
  /* 顶部演示条 */
  #demo{flex:none;display:flex;align-items:center;gap:8px;padding:6px 16px;border-bottom:1px solid var(--line);background:var(--p1);z-index:10}
  #demo .dl{font-size:11px;color:var(--faint)}
  #demo button{background:var(--p2);border:1px solid var(--line2);color:var(--dim);font-size:12px;padding:3px 12px;border-radius:7px;cursor:pointer}
  #demo button:hover{color:var(--tx)}
  #demo .hint{margin-left:auto;font-size:11px;color:var(--faint)}
  /* 状态光带 */
  #strip{flex:none;height:4px;background:#1c232d;z-index:10}
  body.preview #strip{background:linear-gradient(90deg,#1c232d,#3d4754,#1c232d);background-size:200% 100%;animation:scan 1.6s linear infinite}
  body.exec #strip{background:linear-gradient(90deg,#33291a,var(--amber),#33291a);background-size:200% 100%;animation:scan 1.1s linear infinite}
  @keyframes scan{0%{background-position:200% 0}100%{background-position:-200% 0}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  body.estop #strip{background:var(--red);animation:pulse 1s ease-in-out infinite}
  /* 主画布 */
  #stage{flex:1;position:relative;min-height:0}
  #stage canvas{display:block}
  #statusLine{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:5;text-align:center;pointer-events:none}
  #monStatus{font-size:19px;font-weight:650;color:#d4dbe4;letter-spacing:1px}
  #monSub{font-size:12px;color:var(--dim)}
  body.estop #monStatus{color:#ffb3ae}
  /* 幽灵标签 */
  #labels{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}
  .glabel{position:absolute;font-size:12.5px;color:var(--tx);white-space:nowrap;
          transform:translate(-50%,-140%);text-shadow:0 1px 4px rgba(0,0,0,.8)}
  .glabel.amber{color:var(--amber)}
  /* 视角控制 */
  #viewCtl{position:absolute;bottom:12px;right:14px;z-index:6;display:flex;gap:6px}
  #viewCtl button{background:var(--p2);border:1px solid var(--line2);color:var(--dim);font-size:11.5px;padding:5px 12px;border-radius:7px;cursor:pointer}
  #viewCtl button:hover{color:var(--tx)}
  #viewCtl button.on{color:var(--amber);border-color:var(--amber)}
  /* 相机契约面板 */
  #contract{position:absolute;bottom:12px;left:14px;z-index:6;max-width:330px}
  #contract summary{font-size:11.5px;color:var(--dim);cursor:pointer;list-style:none}
  #contract summary:hover{color:var(--tx)}
  #contract .rules{background:var(--p1);border:1px solid var(--line2);border-radius:8px;padding:8px 12px;font-size:11px;color:var(--faint);line-height:1.7;margin-top:4px}
  #contract .rules b{color:var(--dim)}
  /* 加载遮罩 */
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:8;background:var(--bg)}
  #loading span{font-size:13px;color:var(--dim)}
</style>
<script type="importmap">
{
  "imports": {
    "three": "/frontend/node_modules/three/build/three.module.js",
    "three/examples/jsm/": "/frontend/node_modules/three/examples/jsm/"
  }
}
</script>
</head>
<body class="idle">

<div id="demo">
  <span class="dl">演示态：</span>
  <button data-m="idle">待命</button>
  <button data-m="preview">预演</button>
  <button data-m="exec">执行</button>
  <button data-m="estop">急停</button>
  <span class="hint">拖拽 = 环绕（俯仰/缩放已限幅） · 点幽灵臂 = 相机框过去 + 臂开过去</span>
</div>
<div id="strip"></div>

<div id="stage">
  <div id="statusLine">
    <div id="monStatus">加载模型…</div>
    <div id="monSub">URDF + 63MB 网格，几秒钟</div>
  </div>
  <div id="labels"></div>
  <div id="viewCtl">
    <button id="vcReset">复位视角</button>
    <button id="vcOperator">操作者视角</button>
    <button id="vcFollow">跟随目标：关</button>
  </div>
  <details id="contract">
    <summary>相机契约六条 ▸</summary>
    <div class="rules">
      <b>① 锚点固定</b>：相机只围绕臂基座或当前目标位姿旋转，永远有目的坐标<br>
      <b>② 禁平移</b>：想看别处 = 点它，相机带你去<br>
      <b>③ 俯仰 0.15–π/2 · 禁翻滚</b>：永不下地平线，屏幕重力方向与现实一致<br>
      <b>④ 缩放 0.5–3.5 限幅</b>：近=看末端，远=整臂+全部幽灵同框<br>
      <b>⑤ 双预设</b>：复位 / 操作者视角（屏幕方向=真实世界）<br>
      <b>⑥ 跟随默认关</b>：手动拖动相机即让位，自动框选永远是礼貌的
    </div>
  </details>
  <div id="loading"><span>加载模型…</span></div>
</div>

<script type="module">
import * as THREE from "three";
import URDFLoader from "/frontend/node_modules/urdf-loader/src/URDFLoader.js";

window.__audit = { ready: false, ghosts: 0, status: "loading" };

const $ = (s) => document.querySelector(s);
const stage = $("#stage");
const loadingEl = $("#loading");
const monStatus = $("#monStatus");
const monSub = $("#monSub");

function mon(a, b){ monStatus.textContent = a; if (b !== undefined) monSub.textContent = b; }

/* ============ 场景 ============ */
function main(){
const scene = new THREE.Scene();
window.__scene = scene;   // 调试钩子：控制台可直接检查场景
scene.background = new THREE.Color(0x0a0d12);

const camera = new THREE.PerspectiveCamera(45, 4 / 3, 0.05, 40);
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
} catch (error) {
  loadingEl.style.display = "none";
  mon("3D 无法初始化", String(error));
  window.__audit.status = "no-webgl";
  return;   // 大声报错，不留黑屏
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
stage.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x14181f, 2.0));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(1.2, 2, 1);
scene.add(key);
scene.add(new THREE.GridHelper(2, 20, 0x2a3341, 0x1a2029));

/* ============ 相机契约（六条在此兑现） ============ */
let theta = Math.PI / 4, phi = Math.PI / 3.4, radius = 1.35;
const lookTarget = new THREE.Vector3(0, 0.22, 0);
let frameTarget = null;      // 非空 = 正在框选某个幽灵（用户一拖动即置空，礼貌让位）
let follow = false;

function place(){  // 轨道相机：三个自由度，无平移、无翻滚
  camera.position.set(
    radius * Math.sin(phi) * Math.cos(theta),
    radius * Math.cos(phi),
    radius * Math.sin(phi) * Math.sin(theta),
  );
  camera.lookAt(lookTarget);
}

const PRESETS = {
  reset:     { theta: Math.PI / 4,   phi: Math.PI / 3.4, radius: 1.35, look: [0, 0.22, 0] },
  operator:  { theta: 0.25,          phi: 1.32,          radius: 1.65, look: [0, 0.18, 0] },
};
function applyPreset(name){
  const p = PRESETS[name];
  theta = p.theta; phi = p.phi; radius = p.radius;
  lookTarget.set(p.look[0], p.look[1], p.look[2]);
  frameTarget = null;
  place();
}

/* 拖拽环绕（限幅在 onMove 里） */
let dragging = false, lastX = 0, lastY = 0, moved = 0;
renderer.domElement.addEventListener("pointerdown", (e) => {
  dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY;
  renderer.domElement.setPointerCapture(e.pointerId);
});
window.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  moved += Math.abs(dx) + Math.abs(dy);
  theta -= dx * 0.008;
  // 俯仰限幅：0.15（接近正上方）到 π/2（地平线）——永不下到桌面以下
  phi = Math.min(Math.PI / 2, Math.max(0.15, phi - dy * 0.008));
  lastX = e.clientX; lastY = e.clientY;
  frameTarget = null;              // ⑥ 手动一动，自动框选让位
  place();
});
window.addEventListener("pointerup", () => {
  if (dragging && moved < 6) onTap();
  dragging = false;
});
renderer.domElement.addEventListener("wheel", (e) => {
  e.preventDefault();
  // ④ 缩放限幅 0.5–3.5
  radius = Math.min(3.5, Math.max(0.5, radius + e.deltaY * 0.0016));
  frameTarget = null;
  place();
}, { passive: false });

/* ============ URDF 加载 ============ */
const loader = new URDFLoader();
const PKG = "/vendor/reBotArm_control_py/urdf/00-arm-rs_asm-v3";
loader.workingPath = PKG + "/";
loader.packages = PKG;

const ghosts = [];          // { name, root, end, label }
let robot = null;
const URDF_URL = PKG + "/urdf/00-arm-rs_asm-v3.urdf";

function loadRobot(url){
  return new Promise((resolve, reject) => {
    loader.load(url, resolve, undefined, reject);
  });
}
/* urdf-loader 的 load 回调先于网格到达（ArmView3D 的 3s 检查同源），
   材质与 userData 必须等网格挂上树之后再打 */
function waitMeshes(root){
  return new Promise((resolve) => {
    let tries = 0;
    const t = setInterval(() => {
      let n = 0;
      root.traverse((c) => { if (c.isMesh) n += 1; });
      if (n > 0 || ++tries > 150){ clearInterval(t); resolve(n); }
    }, 200);
  });
}

async function buildScene(){
  // 实臂（实心）
  robot = await loadRobot(URDF_URL);
  await waitMeshes(robot);
  robot.rotation.x = -Math.PI / 2;   // URDF Z-up → three Y-up（与 ArmView3D 同款）
  robot.traverse((c) => {
    if (c.isMesh) {
      c.material = new THREE.MeshStandardMaterial({ color: 0x9aa7b8, metalness: 0.25, roughness: 0.55 });
    }
  });
  scene.add(robot);

  // 幽灵位姿：每个位姿独立加载一条臂（three r170 的 Object3D.copy 浅拷贝孙级，
  // clone 会丢网格；独立加载靠浏览器缓存，只有解析成本）。半透明 + 名字标签。
  const SEED = {
    "正面":  { joint2: 0.35, joint3: -0.3, joint5: 0.1 },
    "右45°": { joint1: 0.8,  joint2: 0.45, joint3: -0.5, joint6: 0.25 },
    "侧面":  { joint1: 1.4,  joint2: 0.3,  joint3: -0.25, joint5: -0.2, joint6: 0.5 },
    "俯拍":  { joint1: 0.15, joint2: 0.9,  joint3: -0.9, joint4: 0.3, joint5: 0.4 },
  };
  for (const [name, joints] of Object.entries(SEED)) {
    const g = await loadRobot(URDF_URL);
    await waitMeshes(g);
    g.rotation.x = -Math.PI / 2;
    g.traverse((c) => {
      if (c.isMesh) {
        c.material = new THREE.MeshStandardMaterial({
          color: 0x9aa7b8, metalness: 0.25, roughness: 0.55,
          transparent: true, opacity: 0.35, depthWrite: false,
        });
        c.userData.ghostName = name;
      }
    });
    for (const [j, v] of Object.entries(joints)) {
      if (g.joints[j]) g.setJointValue(j, v);
    }
    scene.add(g);
    const end = g.getObjectByName("link6");
    const label = document.createElement("div");
    label.className = "glabel";
    label.textContent = name;
    $("#labels").appendChild(label);
    ghosts.push({ name, root: g, end, label });
  }

  loadingEl.style.display = "none";
  window.__audit = { ready: true, ghosts: ghosts.length, status: "idle" };
  mon("实况 · 臂静止", "点幽灵臂 = 相机框过去 + 臂开过去");
}
buildScene().catch((e) => {
  loadingEl.style.display = "none";
  mon("模型加载失败", String(e) + " — 检查 submodule 是否 init 过");
  window.__audit.status = "load-error";
});

/* ============ 幽灵标签投影 ============ */
const v = new THREE.Vector3();
function projectLabels(){
  const w = stage.clientWidth, h = stage.clientHeight;
  for (const g of ghosts) {
    if (!g.end) continue;
    g.end.getWorldPosition(v);
    v.project(camera);
    if (v.z > 1) { g.label.style.display = "none"; continue; }
    g.label.style.display = "block";
    g.label.style.left = ((v.x + 1) / 2 * w) + "px";
    g.label.style.top  = ((-v.y + 1) / 2 * h) + "px";
  }
}

/* ============ 点幽灵 = 框选 + 开过去 ============ */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
function onTap(){
  if (mode === "estop"){ mon("已急停 · 臂保持力矩", "先解除再操作"); return; }
  const rect = renderer.domElement.getBoundingClientRect();
  ndc.set(((lastX - rect.left) / rect.width) * 2 - 1, -((lastY - rect.top) / rect.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(scene.children, true);
  for (const h of hits) {
    const name = h.object.userData.ghostName;
    if (!name) continue;
    const g = ghosts.find((x) => x.name === name);
    frameTarget = g;                        // ① 相机锚点切到目标位姿
    highlight(name);
    mon("臂在动", "前往「" + name + "」 · 相机已框过去");
    setTimeout(() => {
      clearHighlight();
      mon("实况 · 已到位", "「" + name + "」");
    }, 1800);
    break;
  }
}

function highlight(name){
  for (const g of ghosts) {
    const on = g.name === name;
    g.root.traverse((c) => { if (c.isMesh) c.material.opacity = on ? 0.85 : 0.35; });
    g.label.classList.toggle("amber", on);
  }
}
function clearHighlight(){
  for (const g of ghosts) {
    g.root.traverse((c) => { if (c.isMesh) c.material.opacity = 0.35; });
    g.label.classList.remove("amber");
  }
}
/* 调试钩子：跳过射线命中，直接走「点幽灵」的后续链路（框选+开过去） */
window.__frameGhost = (name) => {
  const g = ghosts.find((x) => x.name === name);
  if (!g) return "no such ghost";
  frameTarget = g;
  highlight(name);
  mon("臂在动", "前往「" + name + "」 · 相机已框过去");
  setTimeout(() => { clearHighlight(); mon("实况 · 已到位", "「" + name + "」"); }, 1800);
  return "framed";
};

/* ============ 演示态：预演/执行/急停 ============ */
let mode = "idle";
let cycle = null;
let targetIdx = 0;

function setMode(m){
  mode = m;
  document.body.className = m;
  clearInterval(cycle); cycle = null;
  clearHighlight();
  frameTarget = null;
  if (m === "idle"){
    mon("实况 · 臂静止", "点幽灵臂 = 相机框过去 + 臂开过去");
  } else if (m === "estop"){
    mon("已急停 · 臂保持力矩", "原地冻结 · 点「待命」解除");
  } else {
    const isExec = m === "exec";
    mon(isExec ? "执行 · 臂在动" : "预演 · 臂未动", isExec ? "别伸手 · 播放头走真实进度" : "播放头走计划尺，臂一动不动");
    targetIdx = -1;
    cycle = setInterval(() => {
      targetIdx = (targetIdx + 1) % ghosts.length;
      const g = ghosts[targetIdx];
      highlight(g.name);
      if (follow) frameTarget = g;
      mon(isExec ? "执行 · 前往「" + g.name + "」" : "预演 · 第 " + (targetIdx + 1) + " 站「" + g.name + "」",
          isExec ? "目标幽灵已高亮" : "目标幽灵已高亮 · 臂不动");
    }, 2000);
  }
  window.__audit.status = m;
}
document.querySelectorAll("#demo button").forEach((b) => {
  b.addEventListener("click", () => setMode(b.dataset.m));
});

/* ============ 视角控制 ============ */
$("#vcReset").addEventListener("click", () => { applyPreset("reset"); mon("复位视角", "锚点 = 臂基座 · 默认距离"); });
$("#vcOperator").addEventListener("click", () => { applyPreset("operator"); mon("操作者视角", "屏幕方向与真实世界同向"); });
$("#vcFollow").addEventListener("click", function(){
  follow = !follow;
  this.classList.toggle("on", follow);
  this.textContent = follow ? "跟随目标：开" : "跟随目标：关";
  if (follow && mode !== "idle" && mode !== "estop" && ghosts[targetIdx]) frameTarget = ghosts[targetIdx];
});

/* ============ 帧循环 ============ */
function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

const targetPos = new THREE.Vector3();
function tick(){
  requestAnimationFrame(tick);
  if (frameTarget && frameTarget.end){
    // 平滑框选：相机绕到目标位姿附近，lookAt 缓动过去
    frameTarget.end.getWorldPosition(targetPos);
    const desired = targetPos.clone().add(new THREE.Vector3(0.75, 0.85, 0.75).multiplyScalar(radius));
    camera.position.lerp(desired, 0.06);
    lookTarget.lerp(targetPos, 0.06);
    camera.lookAt(lookTarget);
  } else {
    place();
  }
  projectLabels();
  renderer.render(scene, camera);
}
tick();
}
main().catch((e) => {
  loadingEl.style.display = "none";
  mon("原型出错", String(e));
  window.__audit.status = "error";
});
</script>
</body>
</html>
