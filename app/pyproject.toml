[project]
name = "rebot-copilot-camera"
version = "0.1.0"
description = "Teach and repeat with the reBot-RS SDK"
# The human-facing README lives one level up at the repo root, but hatchling
# requires the readme file inside the project directory — and device.sh syncs
# only app/ to the device, so a relative link out of it would dangle there.
# The built wheel therefore carries this short pointer instead; the project is
# never published, it runs from source, so this metadata is never shown.
readme = { content-type = "text/markdown", text = "Teach & Repeat · 示教回放 — see README.md at the repository root." }
# Upper bound inherited from the upstream arm library (reBotArm_control_py pins
# >=3.10,<3.12). Keeping the same window here means the `arm` extra can always
# be installed into this environment without a resolver conflict.
requires-python = ">=3.10,<3.12"
license = "MIT"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "numpy>=1.23.4",
    "rebotarm-control-py",
    "websockets>=15",
]

[project.optional-dependencies]
physics = [
    "rebotarm-control-py[physics]",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.11",
]

[tool.uv.sources]
rebotarm-control-py = { path = "vendor/reBotArm_control_py", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The SDK is an independently packaged, pinned submodule.
[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Keep Ruff's original default checks stable across tool upgrades. New rules
# must be enabled deliberately so CI does not widen its scope silently.
select = ["E4", "E7", "F"]
