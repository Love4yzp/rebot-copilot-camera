# ─────────────────────────────────────────────────────────────────────────────
# Forked from vendor/reBotArm_control_py/config/rebotarm_rs.yaml
# at upstream commit d54040596faa94bdc4f8ad93f3f06b33dfe3a1bf (2026-07-28).
#
# Forked rather than referenced because this project retunes it: mounting a
# Canon body on the end effector changes the load, so the MIT gains and the
# float/lock velocity thresholds will drift from upstream's unloaded values.
#
# `urdf_path` below is relative and is resolved by backend/assets.py against
# the vendored submodule root — NOT by the upstream library's default lookup,
# which would silently hand back the B601-DM arm instead. See assets.py.
# ─────────────────────────────────────────────────────────────────────────────

# reBotArm RS 配置文件（RobStride 电机 + CAN 总线）
# vendor: robstride  |  transport: CAN
# 关节分组: arm (前6关节) + gripper (夹爪，由下面的 gripper 开关控制)
#
# reBotArm RS config (RobStride motors + CAN bus)
# vendor: robstride  |  transport: CAN
# Joint groups: arm (first 6 joints) + gripper (gated by the `gripper` switch)

# Kinematics config (URDF path, end-effector frame)

urdf_path: "urdf/00-arm-rs_asm-v3/urdf/00-arm-rs_asm-v3.urdf"
end_effector_frame: "gripper_end"

# 末端执行器开关。夹爪是可拆装件，切换只改这一行，不动下面的组和关节定义：
#   false —— 无夹爪（或装了吸盘等其它执行器）：加载时剥掉 gripper 组和关节，
#            上游以 NoOpGroup 顶替，所有夹爪调用为空操作；同时生成一份剥掉
#            夹爪连杆质量的 URDF 供动力学模型用 —— 否则重力前馈会一直补偿
#            一块不在机上的 0.8 kg，浮动时臂被自己的前馈推着走
#            （见 backend/assets.py 的 effective_urdf_path）。
#   true  —— 使用电机夹爪：groups.gripper 与文末的 gripper 关节生效。
# End-effector switch — the gripper is a swappable accessory, so toggling it is
# this one line, not an edit to the group/joint definitions below:
#   false — no gripper (or another actuator): the gripper group and joint are
#           stripped at load time; upstream substitutes a NoOpGroup whose every
#           call is a no-op. The gripper links' mass is likewise stripped from
#           the URDF handed to the dynamics model — otherwise the gravity
#           feedforward keeps compensating 0.8 kg that is not on the arm and
#           the floating arm pushes itself around (assets.effective_urdf_path).
#   true  — motor gripper attached: groups.gripper and the gripper joint apply.
gripper: true

channel: can0
rate: 500

groups:
  arm:
    joints: [joint1, joint2, joint3, joint4, joint5, joint6]
  gripper:
    joints: [gripper]

joints:
  - name: joint1
    motor_id: 0x01
    feedback_id: 0xFD
    model: "rs-06"
    vendor: "robstride"
    MIT:
      kp: 50.0
      kd: 3.0
    POS_VEL:
      vel_kp: 12.0
      vel_ki: 0.1
      pos_kp: 13.0
      vlim: 10.0

  - name: joint2
    motor_id: 0x02
    feedback_id: 0xFD
    model: "rs-06"
    vendor: "robstride"
    MIT:
      kp: 150.0
      kd: 10.0
    POS_VEL:
      vel_kp: 14.0
      vel_ki: 0.1
      pos_kp: 16.0
      vlim: 10.0

  - name: joint3
    motor_id: 0x03
    feedback_id: 0xFD
    model: "rs-06"
    vendor: "robstride"
    MIT:
      kp: 150.0
      kd: 10.0
    POS_VEL:
      vel_kp: 14.0
      vel_ki: 0.1
      pos_kp: 14.0
      vlim: 10.0

  - name: joint4
    motor_id: 0x04
    feedback_id: 0xFD
    model: "rs-00"
    vendor: "robstride"
    MIT:
      kp: 50.0
      kd: 5.0
    POS_VEL:
      vel_kp: 5.0
      vel_ki: 0.1
      pos_kp: 20.0
      vlim: 10.0

  - name: joint5
    motor_id: 0x05
    feedback_id: 0xFD
    model: "rs-00"
    vendor: "robstride"
    MIT:
      kp: 50.0
      kd: 4.0
    POS_VEL:
      vel_kp: 4.0
      vel_ki: 0.1
      pos_kp: 10.0
      vlim: 10.0

  - name: joint6
    motor_id: 0x06
    feedback_id: 0xFD
    model: "rs-00"
    vendor: "robstride"
    MIT:
      kp: 50.0
      kd: 4.0
    POS_VEL:
      vel_kp: 4.0
      vel_ki: 0.1
      pos_kp: 10.0
      vlim: 10.0

  - name: gripper
    motor_id: 0x07
    feedback_id: 0xFD
    model: "rs-00"
    vendor: "robstride"
    MIT:
      kp: 50.0
      kd: 4.0
    POS_VEL:
      vel_kp: 4.0
      vel_ki: 0.1
      pos_kp: 10.0
      vlim: 5.0
