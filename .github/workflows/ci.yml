name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    # Includes the golden contract suite (tests/test_contract.py): each case
    # in contract/cases/ runs on the FastAPI TestClient *and* on the frontend
    # mock in Node, and the two transcripts are diffed — a drift on either
    # side fails here.
    runs-on: ubuntu-latest
    steps:
      # The arm layer is a submodule; the URDF in it feeds limit/collision
      # validation, which the contract cases exercise for real.
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - uses: actions/setup-python@v5
        with:
          python-version-file: app/.python-version
      # The contract runner shells out to node + the frontend's esbuild.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: app/frontend
      # The application lives in app/ (pyproject.toml, uv.lock, tests, ruff
      # config all under it), so every uv/ruff step runs from there.
      - run: uv sync --frozen
        working-directory: app
      - run: uv run pytest
        working-directory: app
      - run: uvx ruff check backend tests
        working-directory: app

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: app/frontend
      # tsc (project build) also type-checks contract/mock-driver.ts.
      - run: npm run build
        working-directory: app/frontend
