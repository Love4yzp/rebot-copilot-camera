name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    # Backend REST goldens, TS/Python normalization, physics and viewer boundaries.
    runs-on: ubuntu-latest
    steps:
      # The arm layer is a submodule; the URDF in it feeds limit/collision
      # validation, which the contract cases exercise for real.
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - uses: actions/setup-python@v5
        with:
          python-version-file: app/.python-version
      # The contract runner shells out to node + the frontend's esbuild.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: app/frontend
      # The application lives in app/ (pyproject.toml, uv.lock, tests, ruff
      # config all under it), so every uv/ruff step runs from there.
      - run: python prepare_sdk.py
        working-directory: app
      - run: uv sync --frozen --extra physics
        working-directory: app
      - run: uv run --extra physics pytest
        working-directory: app
      - run: uv run --extra physics python -m backend.export_contract --check
        working-directory: app
      - run: uvx ruff check backend tests
        working-directory: app

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: app/frontend
      # tsc (project build) also type-checks contract/normalize-driver.ts.
      - run: ./dev.sh build
